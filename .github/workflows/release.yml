name: Build Installer (Base)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y makeself gpg shellcheck

      - name: Build installer
        run: bash packaging/make-installer.sh

      # ======================================
      # Phase 6 - Security and validation
      # ======================================

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner --redact

      - name: Run Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          ignore-unfixed: "true"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom.spdx.json"
          artifact-name: "ersatztv-linux-automation-sbom.spdx.json"
          upload-artifact: "true"
          upload-release-assets: "false"

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            --include-git-root
            .

      - name: Run ShellCheck
        run: |
          shellcheck --severity=warning \
            ersatztv-linux-automation.sh \
            packaging/make-installer.sh \
            packaging/payload/ersatztv-linux-automation.sh

      - name: Run PII Guard
        run: |
          chmod +x scripts/pii_guard.sh
          ./scripts/pii_guard.sh

      # ======================================
      # Sign and publish release
      # ======================================

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || {
            echo "::error::GPG_PRIVATE_KEY secret is not configured."
            exit 1
          }

          printf '%s' "$GPG_PRIVATE_KEY" |
            gpg --batch --import

      - name: Sign checksums
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          test -f checksums.txt || {
            echo "::error::checksums.txt was not generated."
            exit 1
          }

          KEYID="$(
            gpg --batch --list-secret-keys --keyid-format=long |
              awk '/^sec/{print $2}' |
              sed 's|.*/||' |
              head -n1
          )"

          test -n "$KEYID" || {
            echo "::error::No imported GPG secret key was found."
            exit 1
          }

          gpg \
            --batch \
            --yes \
            --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --local-user "$KEYID" \
            --armor \
            --detach-sign \
            --output checksums.txt.asc \
            checksums.txt

      - name: Verify release files
        run: |
          for file in \
            ersatztv-installer.run \
            checksums.txt \
            checksums.txt.asc \
            sbom.spdx.json
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required release file is missing or empty: $file"
              exit 1
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          fail_on_unmatched_files: "true"
          files: |
            ersatztv-installer.run
            checksums.txt
            checksums.txt.asc
            sbom.spdx.json